<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Slug Generation</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .test-section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .test-section h2 { margin-top: 0; color: #333; }
        input { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
        .result { margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 3px; }
        .success { color: green; }
        .fail { color: red; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Slug Generation Test Page</h1>

    <div class="test-section">
        <h2>Manual Test Form</h2>
        <form id="testForm">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" placeholder="Enter a title...">

            <label for="url_alias">URL Alias (Slug):</label>
            <input type="text" id="url_alias" name="url_alias" placeholder="Will be auto-generated..." pattern="[a-z0-9\-]+" maxlength="100">

            <button type="button" onclick="runTests()">Run Automated Tests</button>
        </form>
    </div>

    <div class="test-section">
        <h2>Test Results</h2>
        <div id="testResults" class="result"></div>
    </div>

    <script src="/assets/js/slug-generator.js"></script>
    <script>
        // Test cases
        const testCases = [
            { input: "Hello World", expected: "hello-world", description: "Basic text with space" },
            { input: "This is a Test Title!", expected: "this-is-a-test-title", description: "Multiple words with punctuation" },
            { input: "  Spaces   Around  ", expected: "spaces-around", description: "Extra spaces" },
            { input: "Special @#$% Characters", expected: "special-characters", description: "Special characters" },
            { input: "Numbers 123 and Letters", expected: "numbers-123-and-letters", description: "Numbers and letters" },
            { input: "UPPERCASE TEXT", expected: "uppercase-text", description: "Uppercase conversion" },
            { input: "Mix-of-Hyphens---Here", expected: "mix-of-hyphens-here", description: "Multiple hyphens" },
            { input: "Café München Zürich", expected: "caf-m-nchen-z-rich", description: "Accented characters" },
            { input: "", expected: "", description: "Empty string" },
            { input: "---Leading-Trailing---", expected: "leading-trailing", description: "Leading/trailing hyphens" }
        ];

        function runTests() {
            const resultsDiv = document.getElementById('testResults');
            resultsDiv.innerHTML = '<h3>Running Tests...</h3>';

            let passed = 0;
            let failed = 0;
            let results = [];

            testCases.forEach((testCase, index) => {
                const result = window.SlugGenerator.generate(testCase.input);
                const success = result === testCase.expected;

                if (success) {
                    passed++;
                    results.push(`<div class="success">✓ Test ${index + 1}: ${testCase.description}</div>`);
                } else {
                    failed++;
                    results.push(`<div class="fail">✗ Test ${index + 1}: ${testCase.description}<br>
                        Input: "${testCase.input}"<br>
                        Expected: "${testCase.expected}"<br>
                        Got: "${result}"</div>`);
                }
            });

            const summary = `<h3>Test Results: ${passed} passed, ${failed} failed</h3>`;
            resultsDiv.innerHTML = summary + results.join('');

            // Also test the live form behavior
            testLiveForm();
        }

        function testLiveForm() {
            const titleField = document.getElementById('title');
            const slugField = document.getElementById('url_alias');

            // Test auto-generation
            titleField.value = "Test Article Title";
            titleField.dispatchEvent(new Event('input'));

            setTimeout(() => {
                const generatedSlug = slugField.value;
                const resultsDiv = document.getElementById('testResults');

                if (generatedSlug === "test-article-title") {
                    resultsDiv.innerHTML += '<div class="success">✓ Live form test: Auto-generation works!</div>';
                } else {
                    resultsDiv.innerHTML += `<div class="fail">✗ Live form test: Expected "test-article-title", got "${generatedSlug}"</div>`;
                }
            }, 100);
        }

        // Initialize slug generation for the test form
        window.addEventListener('DOMContentLoaded', function() {
            if (window.SlugGenerator) {
                window.SlugGenerator.init();
            }
        });
    </script>
</body>
</html>
