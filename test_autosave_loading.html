<!DOCTYPE html>
<html>
<head>
    <title>Autosave Loading Test</title>
</head>
<body>
    <h1>Autosave Script Loading Test</h1>
    <div id="status">Testing...</div>
    
    <script>
        console.log('Test page loaded');
        
        // Test if we can fetch the autosave.js file
        fetch('/assets/js/autosave.js')
            .then(response => {
                console.log('Fetch response status:', response.status);
                if (response.ok) {
                    document.getElementById('status').innerHTML = 'autosave.js is accessible (HTTP ' + response.status + ')';
                    return response.text();
                } else {
                    document.getElementById('status').innerHTML = 'autosave.js failed to load (HTTP ' + response.status + ')';
                    throw new Error('HTTP ' + response.status);
                }
            })
            .then(text => {
                console.log('File size:', text.length, 'characters');
                console.log('Contains AutoSave class?', text.includes('class AutoSave'));
            })
            .catch(error => {
                console.error('Failed to fetch autosave.js:', error);
                document.getElementById('status').innerHTML = 'Error: ' + error.message;
            });
            
        // Add a simple test to verify class execution
        window.testAutoSaveClass = function() {
            console.log('=== AUTOSAVE CLASS TEST ===');
            console.log('AutoSave type:', typeof AutoSave);
            console.log('AutoSave constructor:', AutoSave);
            
            if (typeof AutoSave === 'function') {
                try {
                    // Test creating an instance with a fake form
                    const testDiv = document.createElement('div');
                    testDiv.id = 'testForm';
                    document.body.appendChild(testDiv);
                    
                    const instance = new AutoSave('testForm');
                    console.log('✅ AutoSave instance created:', !!instance);
                } catch (error) {
                    console.error('❌ Error creating AutoSave instance:', error);
                }
            }
        };

        // Test direct script loading
        const script = document.createElement('script');
        script.src = '/assets/js/autosave.js';
        script.onload = function() {
            console.log('Script tag loaded successfully');
            
            // Immediate check without setTimeout
            console.log('Immediate check - AutoSave type:', typeof AutoSave);
            console.log('Immediate check - window.AutoSave type:', typeof window.AutoSave);
            
            // Check all global variables containing 'Auto'
            const globals = Object.keys(window).filter(key => key.includes('Auto'));
            console.log('Global variables containing "Auto":', globals);
            
            // Check if AutoSave class exists
            try {
                console.log('AutoSave class available?', typeof AutoSave !== 'undefined');
                console.log('window.autoSave exists?', typeof window.autoSave !== 'undefined');
                
                // Check for any JavaScript errors
                if (typeof AutoSave !== 'undefined') {
                    console.log('✅ AutoSave class loaded successfully');
                    // Run the class test
                    window.testAutoSaveClass();
                } else {
                    console.error('❌ AutoSave class not found - possible syntax error');
                }
            } catch (error) {
                console.error('Error in onload callback:', error);
            }
        };
        script.onerror = function() {
            console.error('Script tag failed to load');
        };
        
        // Listen for any JavaScript errors
        window.addEventListener('error', function(e) {
            console.error('JavaScript error detected:', e.message, 'at', e.filename + ':' + e.lineno);
        });
        
        document.head.appendChild(script);
    </script>
</body>
</html>
